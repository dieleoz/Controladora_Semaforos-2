; ===== 01_Firmware/ESP32_Expansion/platformio.ini =====
;
; ESP32 DE EXPANSION - el accesorio colgado de J17.
;
; NO ES EL REPETIDOR. 01_Firmware/Repetidor/ es el puente de radio de la topologia
; de 4 radios del Manual 5, y esa topologia esta FUERA de la configuracion vigente
; (CLAUDE.md seccion 10: dos radios en enlace directo, sin repetidor). Este proyecto
; es otro rol distinto: puente Bluetooth <-> J17 mas reloj DS3231 por I2C.
;
; Se separan a proposito y no se mezclan sus directorios: comparten placa y nada mas.
; Confundirlos es lo que el Anexo del Manual 18 avisa que puede pasar -"un lector
; puede confundirlos"-, y aqui costaria cargar el firmware equivocado en un poste.
;
; QUE ESTE PROYECTO NO HACE, Y NO SE LE ANADE SIN REABRIR EL MANUAL 18:
;   - No manda sobre las luces. Solo semaforo.cpp del STM32 escribe pines de luz.
;   - No origina comandos: todo lo que sale hacia el STM32 viene del buffer de entrada.
;
; BLQ-1 CERRADO EL 31/08: el modulo es un ESP32-WROOM-32 clasico -Xtensa LX6 dual-core,
; Bluetooth v4.2 BR/EDR + BLE, 4 MB de flash, CP2102 a bordo-. BR/EDR es exactamente el
; perfil que abre el createRfcommSocketToServiceRecord de la app, asi que hay SPP y el
; apartado 1 del Manual 10 -congelado por escrito- queda INTACTO.

[env:esp32_expansion]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; LA PARTICION, CON LAS DOS CIFRAS MEDIDAS - Y LA PRIMERA VERSION DE ESTE COMENTARIO
; DECIA UNA FALSEDAD, ASI QUE SE DEJA ESCRITO COMO SE CAYO.
;
; Aqui ponia "el SPP NO CABE en la particion por defecto". Es FALSO, y era plausible:
; la pila Bluedroid clasica pesa casi 1 MB. Medido compilando las dos:
;
;   default.csv   (app0 = 0x140000 = 1.310.720 B)  ->  85,5%  (1.121.001 B usados)
;   huge_app.csv  (app0 = 0x300000 = 3.145.728 B)  ->  35,6%  (1.121.001 B usados)
;
; CABE en la de por defecto. La causa escrita era plausible y falsa, que es exactamente
; lo que CLAUDE.md seccion 4 castiga cuando llega con la palabra "medido" encima.
;
; POR QUE AUN ASI SE ELIGE huge_app.csv, con el motivo verdadero:
;
; default.csv deja 189.719 B libres. El Maestro de este mismo repositorio va por el
; 88,3% y la seccion 7 dice que a ese nivel "ya no queda margen comodo": una funcion
; nueva de tamano medio no entra sin medir antes. Arrancar un proyecto NUEVO al 85,5%
; el primer dia -antes del arnes de contrato, antes de que crezca nada- es meterse en
; esa esquina por eleccion.
;
; EL COSTE, DECLARADO: huge_app.csv NO TIENE OTA -una sola ranura de aplicacion-. Este
; equipo se reflashea por el CP2102 de a bordo, no por el aire, asi que hoy no se pierde
; nada; el dia que alguien quiera actualizar por radio, esta linea es lo que hay que
; cambiar, y entonces el binario tiene que caber en 1,31 MB.
;
; Y el aviso de campo que va pegado: no se puede SUPONER que el USB este disponible en
; el poste. Si la placa portadora alimenta por VIN y alguien enchufa el USB a la vez,
; hay dos fuentes sobre el mismo riel -diseno de placa, no de firmware, pero decide si
; reflashear en campo es posible-.
board_build.partitions = huge_app.csv

; -Wall: este proyecto nace hoy, asi que no arrastra ruido que obligue a apagar los
; avisos. Un aviso que nadie mira es un instrumento apagado (CLAUDE.md seccion 3).
build_flags =
    -Wall
