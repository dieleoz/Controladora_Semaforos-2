[env:repetidor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Entorno de DIAGNÓSTICO. Mismo passthrough, más un informe por USB cada 2s
; con los bytes recibidos de cada lado. Sirve para localizar en qué salto se
; corta el enlace sin instrumentos.
;
;   Compilar/cargar:  pio run -e repetidor_diag -t upload
;   Ver el informe:   pio device monitor -b 115200
;
; Volver a producción:  pio run -e repetidor -t upload
; ---------------------------------------------------------------------------
[env:repetidor_diag]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D MODO_DIAGNOSTICO
