[env:maestro]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink
; CARGA POR SWD EN mode=UR. NO CAMBIAR A HOTPLUG NI A Normal. Banco del 01/08/2026.
; Esta linea es IDENTICA en las dos puntas y debe seguir siendolo.
;
; HOTPLUG se engancha al microcontrolador EN MARCHA. Con un firmware sano conecta a la
; primera y es lo comodo, pero si el firmware cargado se CUELGA AL ARRANCAR -fue el
; caso de N-17, el cristal del reloj- el watchdog lo reinicia cada 4 s y el reinicio
; cae en mitad del borrado: "Error: failed to erase memory", una y otra vez. El sintoma
; delator es que el programador ni siquiera logra leer el tamano de la flash y responde
; "NVM size: 128 KBytes (default)" en un chip que tiene 64 KB.
;
; UR retiene el micro en reset mientras conecta, asi que el firmware anterior NUNCA
; llega a ejecutarse y no hay watchdog que estorbe. Con UR el tamano se lee bien
; -"NVM size: 64 KBytes"- y el borrado masivo se completa.
;
; SE ELIGE UR PARA SIEMPRE, Y NO SOLO PARA SALIR DEL PASO: funciona en los DOS
; escenarios, con firmware sano y con firmware colgado. HOTPLUG solo en uno. Cuando el
; unico momento en que de verdad necesitas cargar es aquel en que la tarjeta no
; arranca, el modo que falla justo ahi no puede ser el predeterminado.
;
; ASI SE SALIO DE N-17: el Maestro entro con UR, y esa carga metio el firmware bueno.
; Desde ese momento ya no habia bucle de watchdog y HOTPLUG volvio a funcionar por si
; solo. Eso NO demuestra que HOTPLUG sea mejor -es la trampa en la que es facil caer al
; probarlo despues-: demuestra que el problema que HOTPLUG no sabe sortear ya estaba
; resuelto cuando se volvio a probar.
;
; EL PRECIO DE UR, para que nadie lo confunda con una averia: enganchar es cuestion de
; TIMING -hay que acertar la ventana tras soltar el reset- y en banco fallo tres veces
; con "Unable to get core ID" antes de entrar. SI FALLA, REINTENTA. Y si se resiste,
; manten pulsado SW1 al lanzar la carga y sueltalo al ver "Download in Progress".
;
; NRST SI ESTA CABLEADO, por si alguien deduce lo contrario al ver fallar UR: uno de
; los intentos devolvio "DEV_TARGET_HELD_UNDER_RESET", que significa que el target esta
; retenido en reset, y sin esa linea ese error no puede aparecer. Volver a HOTPLUG por
; ese motivo seria cambiar la configuracion correcta por un diagnostico equivocado.
;
; -e all tampoco da problemas en estos clones: bajo UR el borrado masivo se completo
; sin queja ("Mass erase successfully achieved").
upload_command = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" --connect port=swd mode=UR -e all --write "$SOURCE" -rst
; D-32 (1), 13/09/2026: SALE U8g2. La pantalla se retiro del equipo el 28/08
; (D-17.bis) y su codigo el 13/09; la libreria era el 89 % del precio de
; arrastrarla. Medido por fichero objeto sobre firmware.map, no por nombre de
; simbolo: libU8g2 ponia 11.848 B de flash en esta punta.
lib_deps =
    stm32duino/STM32duino RTC@^1.4.0

; SFTY-18: el RTC interno necesita el cristal Y2 de 32.768 kHz (ya en la placa) y
; la pila en VBAT. Ver 03_Hardware_Tarjeta/MAPEO_TARJETA_KICAD.md seccion 4.
; No hace falta -D HAL_RTC_MODULE_ENABLED: el core de STM32duino ya lo define y
; repetirlo solo produce avisos de redefinicion.
;
; OJO: un solo build_flags. Dos lineas con la misma clave NO se suman: la segunda
; pisa a la primera y se perderia -D ROL_MAESTRO.
build_flags =
    -D ROL_MAESTRO
    !python -c "import subprocess as s,shutil;g=shutil.which('git');r=lambda a:s.run([g]+a,capture_output=True,text=True);h=r(['rev-parse','--short=7','HEAD']) if g else None;d=r(['status','--porcelain']) if g else None;print('' if not h or not d or h.returncode or d.returncode or not h.stdout.strip() else '-DFW_HASH='+h.stdout.strip()+' -DFW_SUCIO='+('1' if d.stdout.strip() else '0'))" || exit 0
; EL SELLO DE FIRMWARE (version_fw.h). La linea de arriba es IDENTICA en las tres
; puntas y debe seguir siendolo: lo compara version_01_sello_de_firmware.
;
; QUE IMPRIME: "-DFW_HASH=<7 hex> -DFW_SUCIO=<0|1>", o NADA. Si imprime nada, el
; binario sale SIN SELLAR y el equipo contesta que no sabe que firmware lleva; lo que
; no puede pasar nunca es que salga con un sello inventado.
;
; POR QUE UN python -c Y NO UN ECHO CON $(...): el '!' se ejecuta por el shell del
; sistema, que en esta maquina es cmd.exe y NO hace sustitucion de comandos. Un
; one-liner de python es lo unico que corre igual en las dos: platformio ya trae uno.
;
; POR QUE NO LLEVA COMILLAS DENTRO DEL FLAG -o sea, por que el hash viaja como token y
; no como cadena-: el escape de -DFW_HASH=\"abc\" tiene que sobrevivir al shell Y a
; SCons, y cuando se rompe se rompe EN SILENCIO dejando el binario sin sellar. La
; comilla la pone el preprocesador en version_fw.h, donde no hay shell que la toque.
;
; POR QUE NI UN ';' VA PRECEDIDO DE ESPACIO, Y NO ES ESTILO: platformio lee este
; fichero con ConfigParser(inline_comment_prefixes=("#", ";")) -medido en
; platformio/project/config.py:97-, que CORTA el valor en un ';' o un '#' precedido de
; espacio. Un espacio de mas ahi deja el comando a medias y el unico sintoma es un
; binario sin sellar. Por eso tampoco hay ningun '#' en la linea, y por eso lo mide un
; pack: es la averia que no se ve leyendo.
;
; ==========================================================================
; OJO - LAS DOS PROTECCIONES DEL FINAL NO SON CINTURON Y TIRANTES: SIN ELLAS ESTA LINEA
; TUMBA LA COMPILACION EN LA MAQUINA QUE NO TENGA git O python. MEDIDO EL 16/09, Y LA
; PRIMERA VERSION DE ESTE COMENTARIO AFIRMABA LO CONTRARIO SIN HABERLO PROBADO.
;
; Lo que pasa de verdad cuando el comando del '!' devuelve un codigo distinto de cero:
;   SCons/Environment.py:793  ->  raise OSError(f'{command!r} exited {cp.returncode}')
; o sea [FAILED] y `pio run` con exit 1. Un `git` ausente hacia que subprocess.run
; lanzara FileNotFoundError, el one-liner salia con 1, y la fila "compila maestro" de la
; compuerta se caia entera: una PUERTA ABIERTA (CLAUDE.md 1) abierta por el sello.
;
;   1. shutil.which('git') delante. Sin git, `g` es None, no se lanza nada, se imprime
;      la cadena vacia y se sale con 0. Si which() no ve un git que si esta -N-44- el
;      error cae hacia SIN SELLAR, que es el lado seguro.
;   2. `|| exit 0` al final, que cubre lo que which() no puede: que falte python. El
;      shell come el fallo y devuelve 0. Su stderr SI se imprime -SCons lo vuelca sin
;      fallar-, asi que el motivo se ve en el log del build en vez de desaparecer.
;
; LAS DOS MEDIDAS, corridas sobre esta punta el 16/09 sustituyendo el nombre del binario
; por uno inexistente:
;   sin python  ->  [SUCCESS], flash 42.000 B, binario SIN SELLAR
;   sin git     ->  [SUCCESS], flash 42.000 B, y dentro del .elf:
;                   "$ERR,CMD:VERSION,DESC:SIN_SELLAR,NODE:MAESTRO,FW:--"
; con el sello puesto son 42.008 B. Los 8 B de diferencia son los dos literales.
; ==========================================================================
; D-32 (1), 13/09/2026: aqui iban -D U8X8_NO_HW_I2C y -D U8X8_NO_HW_SPI. Eran de
; N-70: sin ellas U8x8lib.cpp referenciaba TwoWire::setClock() y el enlazador se
; traia Wire.cpp -> twi.c -> el HAL de I2C entero (5.160 B de flash y 352 B de RAM
; para un bus que no existe). Se van CON la libreria: sin U8g2 no hay quien
; referencie nada de eso, y dejar dos -D apuntando a una libreria ausente es una
; instruccion que ya no describe a este firmware. Confirmado midiendo las dos
; pasadas: el HAL de I2C sigue fuera del binario.
