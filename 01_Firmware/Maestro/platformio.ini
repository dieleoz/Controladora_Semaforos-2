[env:maestro]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink
; CARGA POR SWD EN mode=UR. NO CAMBIAR A HOTPLUG NI A Normal. Banco del 01/08/2026.
; Esta linea es IDENTICA en las dos puntas y debe seguir siendolo.
;
; HOTPLUG se engancha al microcontrolador EN MARCHA. Con un firmware sano conecta a la
; primera y es lo comodo, pero si el firmware cargado se CUELGA AL ARRANCAR -fue el
; caso de N-17, el cristal del reloj- el watchdog lo reinicia cada 4 s y el reinicio
; cae en mitad del borrado: "Error: failed to erase memory", una y otra vez. El sintoma
; delator es que el programador ni siquiera logra leer el tamano de la flash y responde
; "NVM size: 128 KBytes (default)" en un chip que tiene 64 KB.
;
; UR retiene el micro en reset mientras conecta, asi que el firmware anterior NUNCA
; llega a ejecutarse y no hay watchdog que estorbe. Con UR el tamano se lee bien
; -"NVM size: 64 KBytes"- y el borrado masivo se completa.
;
; SE ELIGE UR PARA SIEMPRE, Y NO SOLO PARA SALIR DEL PASO: funciona en los DOS
; escenarios, con firmware sano y con firmware colgado. HOTPLUG solo en uno. Cuando el
; unico momento en que de verdad necesitas cargar es aquel en que la tarjeta no
; arranca, el modo que falla justo ahi no puede ser el predeterminado.
;
; ASI SE SALIO DE N-17: el Maestro entro con UR, y esa carga metio el firmware bueno.
; Desde ese momento ya no habia bucle de watchdog y HOTPLUG volvio a funcionar por si
; solo. Eso NO demuestra que HOTPLUG sea mejor -es la trampa en la que es facil caer al
; probarlo despues-: demuestra que el problema que HOTPLUG no sabe sortear ya estaba
; resuelto cuando se volvio a probar.
;
; EL PRECIO DE UR, para que nadie lo confunda con una averia: enganchar es cuestion de
; TIMING -hay que acertar la ventana tras soltar el reset- y en banco fallo tres veces
; con "Unable to get core ID" antes de entrar. SI FALLA, REINTENTA. Y si se resiste,
; manten pulsado SW1 al lanzar la carga y sueltalo al ver "Download in Progress".
;
; NRST SI ESTA CABLEADO, por si alguien deduce lo contrario al ver fallar UR: uno de
; los intentos devolvio "DEV_TARGET_HELD_UNDER_RESET", que significa que el target esta
; retenido en reset, y sin esa linea ese error no puede aparecer. Volver a HOTPLUG por
; ese motivo seria cambiar la configuracion correcta por un diagnostico equivocado.
;
; -e all tampoco da problemas en estos clones: bajo UR el borrado masivo se completo
; sin queja ("Mass erase successfully achieved").
upload_command = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" --connect port=swd mode=UR -e all --write "$SOURCE" -rst
lib_deps =
    olikraus/U8g2@^2.35.19
    stm32duino/STM32duino RTC@^1.4.0

; SFTY-18: el RTC interno necesita el cristal Y2 de 32.768 kHz (ya en la placa) y
; la pila en VBAT. Ver 03_Hardware_Tarjeta/MAPEO_TARJETA_KICAD.md seccion 4.
; No hace falta -D HAL_RTC_MODULE_ENABLED: el core de STM32duino ya lo define y
; repetirlo solo produce avisos de redefinicion.
;
; OJO: un solo build_flags. Dos lineas con la misma clave NO se suman: la segunda
; pisa a la primera y se perderia -D ROL_MAESTRO.
build_flags =
    -D ROL_MAESTRO
    ; N-70: la pantalla es SW_SPI y en el equipo NO HAY NINGUN I2C -el bus por
    ; hardware esta copado: PB6/PB7 los usa la LCD y PB10/PB11 el RS-485-. Sin estas
    ; dos banderas, U8x8lib.cpp referencia TwoWire::setClock() y el enlazador arrastra
    ; Wire.cpp -> twi.c -> el HAL de I2C entero. Medido en firmware.map, no supuesto:
    ; 5.160 B de flash (93,5% -> 85,6%) y 352 B de RAM para un bus que no existe.
    ; Si algun dia entra un periferico por I2C -el PCF8574 del roadmap-, estas dos
    ; lineas se quitan y la flash vuelve a subir: es una decision, no una limpieza.
    -D U8X8_NO_HW_I2C
    -D U8X8_NO_HW_SPI
