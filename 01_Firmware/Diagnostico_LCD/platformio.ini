; ===== Diagnostico_LCD/platformio.ini =====
;
; Proyecto AISLADO de diagnostico de la LCD del Esclavo (N-22).
;
; Mismo microcontrolador y misma forma de cargar que el Esclavo, y NADA MAS: sin
; radio, sin reloj, sin respaldo, sin watchdog, sin menu. Si con este firmware la
; pantalla tampoco pinta, el problema no puede estar en ninguna de esas cosas.
[env:diagnostico]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink

; CARGA POR SWD EN mode=UR. NO CAMBIAR A HOTPLUG. Copiado tal cual del Esclavo.
;
; HOTPLUG se engancha al microcontrolador EN MARCHA. Con un firmware sano conecta a la
; primera, pero si el firmware cargado se cuelga al arrancar, el reinicio cae en mitad
; del borrado: "Error: failed to erase memory", una y otra vez. El sintoma delator es
; que el programador responde "NVM size: 128 KBytes (default)" en un chip de 64 KB.
;
; UR retiene el micro en reset mientras conecta, asi que el firmware anterior NUNCA
; llega a ejecutarse. Funciona en los DOS escenarios, con firmware sano y con firmware
; colgado; HOTPLUG solo en uno.
;
; AQUI IMPORTA MAS QUE EN NINGUN SITIO: la tarjeta que se esta diagnosticando es
; justamente la que no da senales de vida. El modo de carga que falla cuando la tarjeta
; no arranca no puede ser el predeterminado de la herramienta que sirve para averiguar
; por que no arranca.
;
; EL PRECIO DE UR: enganchar es cuestion de TIMING -hay que acertar la ventana tras
; soltar el reset- y en banco fallo tres veces con "Unable to get core ID" antes de
; entrar. SI FALLA, REINTENTA. Y si se resiste, manten pulsado SW1 al lanzar la carga y
; sueltalo al ver "Download in Progress".
upload_command = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" --connect port=swd mode=UR -e all --write "$SOURCE" -rst

; OJO: una sola clave lib_deps. Dos lineas con la misma clave NO se suman: la segunda
; pisa a la primera. Aqui solo hace falta U8g2; el RTC del Esclavo se deja fuera a
; proposito, porque el oscilador parado (N-24) es una de las cosas que este proyecto
; tiene que descartar como causa de un arranque que no llega a la pantalla.
lib_deps =
    olikraus/U8g2@^2.35.19
